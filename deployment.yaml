# ─── Namespace ────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: taxxy

# ═══════════════════════════════════════════════════════════════
#  AUTH SERVICE
# ═══════════════════════════════════════════════════════════════
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: taxxy
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: taxxy/auth-service:latest   # replace with your registry
          ports: [{ containerPort: 50051, name: grpc }]
          env:
            - { name: GRPC_PORT,        value: "50051" }
            - { name: DB_HOST,          value: postgres-auth }
            - { name: DB_PORT,          value: "5432" }
            - { name: DB_USER,          value: taxxy_auth }
            - { name: DB_PASSWORD,      valueFrom: { secretKeyRef: { name: taxxy-secrets, key: auth-db-password } } }
            - { name: DB_NAME,          value: taxxy_auth }
            - { name: DB_SSLMODE,       value: disable }
            - { name: JWT_SECRET,       valueFrom: { secretKeyRef: { name: taxxy-secrets, key: jwt-secret } } }
            - { name: JWT_EXPIRY_HOURS, value: "24" }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: taxxy
spec:
  selector: { app: auth-service }
  ports: [{ port: 50051, targetPort: grpc }]

