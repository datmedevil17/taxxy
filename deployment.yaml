apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: taxxy
spec:
  replicas: 3    # more replicas than backend services – it's the entry point
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: taxxy/api-gateway:latest
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: HTTP_PORT,              value: "8080" }
            - { name: AUTH_SERVICE_URL,       value: auth-service:50051 }
            - { name: RIDER_SERVICE_URL,      value: rider-service:50052 }
            - { name: TRIP_SERVICE_URL,       value: trip-service:50053 }
            - { name: DRIVER_SERVICE_URL,     value: driver-service:50054 }
            - { name: PAYMENT_SERVICE_URL,    value: payment-service:50055 }
          # Liveness & readiness probes use the /health endpoint
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5

---
# ─── ClusterIP Service ───────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: taxxy
spec:
  selector: { app: api-gateway }
  ports: [{ port: 80, targetPort: http }]

---
# ─── Ingress (nginx) ─────────────────────────────────────────
# Assumes an ingress-nginx controller is installed in the cluster.
# For local minikube: minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taxxy-ingress
  namespace: taxxy
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: taxxy.local            # add to /etc/hosts → minikube ip
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 80 }

# ─── RabbitMQ ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: taxxy
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - { containerPort: 5672, name: amqp }
            - { containerPort: 15672, name: mgmt }
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: guest }
            - { name: RABBITMQ_DEFAULT_PASS, value: guest }
          volumeMounts:
            - { name: rabbitmq-data, mountPath: /var/lib/rabbitmq }
      volumes:
        - name: rabbitmq-data
          emptyDir: {}   # Use a PVC in production
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: taxxy
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: mgmt,  port: 15672, targetPort: mgmt }

# ─── Postgres Helper Template ─────────────────────────────────
# Each Postgres instance follows the same pattern.
# We use StatefulSet + PVC for durable storage.

---
# ── Auth DB ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-auth
  namespace: taxxy
spec:
  serviceName: postgres-auth
  replicas: 1
  selector:
    matchLabels: { app: postgres-auth }
  template:
    metadata:
      labels: { app: postgres-auth }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER,     value: taxxy_auth }
            - { name: POSTGRES_PASSWORD, value: password }
            - { name: POSTGRES_DB,       value: taxxy_auth }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
  namespace: taxxy
spec:
  clusterIP: None  # headless – required for StatefulSet DNS
  selector: { app: postgres-auth }
  ports: [{ port: 5432 }]

