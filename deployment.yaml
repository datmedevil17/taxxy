# ═══════════════════════════════════════════════════════════════
#  SECRETS (replace values with base64-encoded real secrets)
# ═══════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: Secret
metadata:
  name: taxxy-secrets
  namespace: taxxy
type: Opaque
data:
  # echo -n "password" | base64  →  cGFzc3dvcmQ=
  auth-db-password:    cGFzc3dvcmQ=
  rider-db-password:   cGFzc3dvcmQ=
  trip-db-password:    cGFzc3dvcmQ=
  driver-db-password:  cGFzc3dvcmQ=
  payment-db-password: cGFzc3dvcmQ=
  # echo -n "taxxy-prod-jwt-secret-rotate-me" | base64
  jwt-secret:          dGF4eHktcHJvZC1qd3Qtc2VjcmV0LXJvdGF0ZS1tZQ==
